<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hasil Kuis – ChronoAtlas (Guru)</title>
<style>
body{font-family:system-ui,sans-serif;max-width:860px;margin:2rem auto;padding:0 1rem;color:#1b1c1a}
input,button{padding:.55rem .8rem;border-radius:.6rem;border:1px solid #bbb;font-size:.9rem}
button{background:#1f5f4a;color:#fff;border:0;cursor:pointer;margin-left:.3rem}
table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:.9rem}
th,td{border-bottom:1px solid #ddd;padding:.5rem;text-align:left}
.err{color:#b3261e;margin-top:.8rem}
</style></head><body>
<h1>Hasil Kuis Kilat – Guru</h1>
<input id="k" type="password" placeholder="Kunci guru">
<button onclick="load()">Tampilkan</button>
<button onclick="csv()">Unduh CSV</button>
<div id="e" class="err"></div>
<table><thead><tr><th>Waktu</th><th>Nama</th><th>Kelas</th><th>Skor</th></tr></thead><tbody id="b"></tbody></table>
<script>
let rows=[];
async function load(){
  e.textContent='';
  const r=await fetch('/api/results',{headers:{'x-teacher-key':k.value}});
  const j=await r.json();
  if(!r.ok){e.textContent=j.error||'Gagal';return}
  rows=j.results;
  b.innerHTML='';
  rows.forEach(x=>{const tr=b.insertRow();
    [new Date(x.at).toLocaleString('id-ID'),x.name,x.kelas,x.score+'/'+x.total+' ('+x.percent+'%)']
      .forEach(t=>tr.insertCell().textContent=t)});
}
function csv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const t=['waktu,nama,kelas,skor,persen',...rows.map(x=>[x.at,x.name,x.kelas,x.score,x.percent].map(q).join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='hasil_kuis.csv';a.click();
}
</script></body></html>
